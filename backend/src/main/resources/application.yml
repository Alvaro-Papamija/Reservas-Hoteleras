server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024
  servlet:
    context-path: /

spring:
  application:
    name: hotel-backend

  # Configuración de Conexión a Base de Datos (H2 embebido por defecto para desarrollo plug-and-play, o PostgreSQL con DB_URL)
  datasource:
    url: ${DB_URL:jdbc:h2:mem:hotel_alborada_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      pool-name: HotelAlboradaHikariPool
      maximum-pool-size: 10
      minimum-idle: 4
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  h2:
    console:
      enabled: true
      path: /h2-console

  # Configuración de Redis Cache Empresarial
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  cache:
    type: ${CACHE_TYPE:none}
    redis:
      time-to-live: 600000ms # 10 minutos TTL
      cache-null-values: false

  # Configuración de Spring Data JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

# Parámetros de Autenticación, JWT, CORS y Seguridad OWASP
app:
  jwt:
    secret: ${JWT_SECRET:HotelAlboradaSuperSecureSecretKey2026WithSufficientEntropyAndLengthForHMACSHA256}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hora
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
  security:
    rate-limit:
      max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:5}
      lockout-duration-minutes: ${RATE_LIMIT_LOCKOUT_MINUTES:15}

# Documentación OpenAPI 3 / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Configuración de Logging - Información interna y consultas SQL silenciadas en producción
logging:
  level:
    root: INFO
    com.hotelalborada.backend: INFO
    org.hibernate.SQL: ${HIBERNATE_LOG_LEVEL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${SQL_BINDER_LOG_LEVEL:WARN}

