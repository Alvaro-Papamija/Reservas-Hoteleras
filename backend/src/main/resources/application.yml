server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024
  servlet:
    context-path: /

spring:
  application:
    name: hotel-backend

  # Configuración de Conexión a PostgreSQL mediante Variables de Entorno
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hotel_alborada_db}?sslmode=disable
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HotelAlboradaHikariPool
      maximum-pool-size: 10
      minimum-idle: 4
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # Configuración de Redis Cache Empresarial
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  cache:
    type: ${CACHE_TYPE:none}
    redis:
      time-to-live: 600000ms # 10 minutos TTL
      cache-null-values: false

  # Configuración de Spring Data JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

# Parámetros de Autenticación, JWT y Seguridad OWASP
app:
  jwt:
    secret: ${JWT_SECRET:HotelAlboradaSuperSecureSecretKey2026WithSufficientEntropyAndLengthForHMACSHA256}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hora
  security:
    rate-limit:
      max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:5}
      lockout-duration-minutes: ${RATE_LIMIT_LOCKOUT_MINUTES:15}

# Configuración de Logging
logging:
  level:
    root: INFO
    com.hotelalborada.backend: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

