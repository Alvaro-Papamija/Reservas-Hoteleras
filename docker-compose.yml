version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel_alborada_postgres
    restart: always
    environment:
      POSTGRES_DB: hotel_alborada_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alborada_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel_alborada_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hotel_alborada_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hotelalborada.com
      PGADMIN_DEFAULT_PASSWORD: admin_secret_2026
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
